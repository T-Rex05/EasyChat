# EasyChat 单容器部署：仅应用 + 持久卷，无 MySQL/Redis/Neo4j/Milvus。
# 使用：cd docker && cp .env.example .env && docker compose up --build -d
name: easychat

services:
  easychat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: easychat
    restart: unless-stopped
    ports:
      - "${PORT:-8001}:8001"
    environment:
      EASYCHAT_DATA_DIR: /app/data
      EASYCHAT_ROOT: /app
      EASYCHAT_JWT_SECRET: ${EASYCHAT_JWT_SECRET:?EASYCHAT_JWT_SECRET is required}
      EASYCHAT_ENCRYPTION_SECRET: ${EASYCHAT_ENCRYPTION_SECRET:-}
      EASYCHAT_HERMES_ENABLED: ${EASYCHAT_HERMES_ENABLED:-false}
      EASYCHAT_WECHAT_ENABLED: ${EASYCHAT_WECHAT_ENABLED:-false}
      EASYCHAT_MCP_ENABLED: ${EASYCHAT_MCP_ENABLED:-false}
      EASYCHAT_EMAIL_ENABLED: ${EASYCHAT_EMAIL_ENABLED:-false}
      EASYCHAT_PDF_ENABLED: ${EASYCHAT_PDF_ENABLED:-false}
      EASYCHAT_RUNNER_ENABLED: ${EASYCHAT_RUNNER_ENABLED:-false}
    volumes:
      - easychat_data:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  easychat_data:
